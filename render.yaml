# Render Blueprint for the Kids Bible Quiz API.
# In the Render dashboard: New -> Blueprint -> select this repo. Render reads
# this file and pre-fills the service; you only need to fill in the env vars
# marked `sync: false` (Render prompts for these rather than storing them
# here, since they're secrets).
services:
  - type: web
    name: kids-bible-quiz-api
    runtime: node
    plan: free
    rootDir: server
    # NODE_ENV=production (below) makes plain `npm install` skip
    # devDependencies — which is where typescript, the prisma CLI, and
    # @types/* all live. Without --include=dev, the build falls through to
    # whatever tsc happens to be on Render's base image instead of the
    # version this project is actually pinned to and tested against.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin to what this project is actually developed/tested against,
      # rather than trusting Render's default image version.
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATABASE_URL
        sync: false
      # Neon's *direct* (non-pooled) connection string — used only for
      # `prisma migrate deploy` during the build. See schema.prisma's
      # datasource comment for why this has to be separate from
      # DATABASE_URL.
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
